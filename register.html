<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عضویت | Brand Win</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="./css/styleregister.css" />
  </head>
  <body>
    <div class="form-container">
      <h2>عضویت در خبرنامه</h2>
      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label">نام</label>
          <input type="text" class="form-control" id="name" required />
          <!-- required -->
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">ایمیل</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">پسورد</label>
          <input type="password" class="form-control" id="pass" required />
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">تکرار پسورد</label>
          <input type="password" class="form-control" id="againpass" required />
        </div>
        <button type="submit" class="btn btn-custom">ثبت</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
